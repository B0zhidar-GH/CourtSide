{% extends "base.html" %}

{% block title %}Edit Tournament | CourtSide{% endblock %}

{% block content %}
<section>
    <h2>Edit {{ tournament.name }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'tournament-detail' tournament.pk %}">
        Cancel
    </a>
</section>
{% endblock %}
