{% extends "base.html" %}

{% block title %}Delete Tournament | CourtSide{% endblock %}

{% block content %}
<section>
    <h2>Delete Tournament</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ tournament.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete Tournament</button>
    </form>

    <a href="{% url 'tournament-detail' tournament.pk %}">
        Cancel
    </a>
</section>
{% endblock %}
