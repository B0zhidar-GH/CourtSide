{% extends "base.html" %}

{% block title %}Log In | CourtSide{% endblock %}

{% block content %}
<section>
    <h2>Log In</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Log In</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</section>
{% endblock %}
