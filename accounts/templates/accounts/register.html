{% extends "base.html" %}

{% block title %}Register | CourtSide{% endblock %}

{% block content %}
<section>
    <h2>Create Your Account</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>
</section>
{% endblock %}
